openapi: 3.0.3
info:
  title: Noty API
  version: 1.0.0
  description: |
    REST API for Noty, a notes-and-projects application.

    ## Authentication
    Authentication is cookie based. A successful register or login sets two
    `HttpOnly` cookies:

    - `access_token` — signed JWT valid for 15 minutes, sent on every request
      (`Path=/`). The `sub` claim is the user id.
    - `refresh_token` — opaque random token valid for 30 days
      (`Path=/api/auth`). Only its SHA-256 hash is stored in `refresh_tokens`.

    `POST /auth/refresh` issues a new access token. The refresh token is only
    rotated (revoked and replaced) when it has less than 24 hours left before
    expiry; otherwise the existing token is kept. `POST /auth/logout` revokes
    the current refresh token and clears both cookies.

    Cookies use `SameSite=Lax`, `HttpOnly`, and `Secure` in production. Unsafe
    requests from other origins are rejected, which is the CSRF mitigation;
    no CSRF header is required.

    ## Authorization
    Every resource is scoped to the authenticated user. A resource that exists
    but belongs to another user responds with `404 NOT_FOUND` rather than
    `403` to avoid leaking its existence.

    ## Pagination
    Endpoints that return a paginated collection return:

    ```json
    {
      "items": [],
      "meta": { "page": 1, "perPage": 20, "total": 0, "totalPage": 0 }
    }
    ```

    `page` defaults to `1`, `perPage` defaults to `20` and is capped at `100`.
    `totalPage` is `ceil(total / perPage)` and is `0` when there are no items.

    ## Errors
    Errors share one envelope:

    ```json
    { "error": { "code": "VALIDATION_ERROR", "message": "Invalid input", "details": [] } }
    ```
servers:
  - url: http://localhost:3000/api
    description: Local development
tags:
  - name: Auth
    description: Registration, sessions, and the current user.
  - name: Tags
    description: User-owned labels that can be attached to projects.
  - name: Projects
    description: Containers for notes, optionally linked to one tag.
  - name: Notes
    description: Notes with rich-text content, optionally attached to a project.
security:
  - cookieAuth: []
paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a user
      description: |
        Creates a user and signs them in by setting the `access_token` and
        `refresh_token` cookies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created and signed in. Auth cookies are set.
          headers:
            Set-Cookie:
              description: |
                Two `HttpOnly` cookies are set: `access_token`
                (15 minutes, `Path=/`) and `refresh_token`
                (30 days, `Path=/api/auth`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in
      description: |
        Authenticates with either username or email and signs the user in by
        setting the `access_token` and `refresh_token` cookies.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in. Auth cookies are set.
          headers:
            Set-Cookie:
              description: |
                Two `HttpOnly` cookies are set: `access_token`
                (15 minutes, `Path=/`) and `refresh_token`
                (30 days, `Path=/api/auth`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Refresh the session
      description: |
        Issues a new access token from the `refresh_token` cookie. When the
        refresh token has less than 24 hours before expiry it is revoked and
        replaced with a new one; otherwise it is kept unchanged. Rotated
        tokens are marked with `revoked_at` and can no longer be used.
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Session refreshed. A new access token cookie is set.
          headers:
            Set-Cookie:
              description: |
                A new `access_token` cookie, plus a new `refresh_token` cookie
                only when the token was rotated.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out
      description: |
        Revokes the current refresh token and clears both auth cookies. The
        endpoint is idempotent and returns `204` even when no valid session is
        present.
      security:
        - refreshCookie: []
        - cookieAuth: []
      responses:
        '204':
          description: Signed out. Auth cookies are cleared.
          headers:
            Set-Cookie:
              description: Expired `access_token` and `refresh_token` cookies.
              schema:
                type: string
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the current user
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Auth]
      operationId: updateCurrentUser
      summary: Update the current user
      description: Updates the username and/or email. Omitted fields are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change the current user's password
      description: |
        Verifies the current password, stores the new password hash, and
        revokes every other active refresh token. The current session remains
        valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: List tags
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: sort
          in: query
          description: Field to sort by.
          schema:
            type: string
            enum: [name]
            default: name
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: A page of tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tags]
      operationId: createTag
      summary: Create a tag
      description: Tag names are not required to be unique per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: Tag created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /tags/{tagId}:
    get:
      tags: [Tags]
      operationId: getTag
      summary: Get a tag
      parameters:
        - $ref: '#/components/parameters/TagIdPath'
      responses:
        '200':
          description: The tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tags]
      operationId: updateTag
      summary: Update a tag
      parameters:
        - $ref: '#/components/parameters/TagIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTagRequest'
      responses:
        '200':
          description: Updated tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Tags]
      operationId: deleteTag
      summary: Delete a tag
      description: |
        Deletes the tag. Projects that referenced it remain and have
        `tag_id` set to `null`.
      parameters:
        - $ref: '#/components/parameters/TagIdPath'
      responses:
        '204':
          description: Tag deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: tag_id
          in: query
          description: Only return projects linked to this tag.
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          description: Field to sort by.
          schema:
            type: string
            enum: [title]
            default: title
        - $ref: '#/components/parameters/Order'
      responses:
        '200':
          description: A page of projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      description: |
        `tag_id`, when provided, must reference a tag owned by the authenticated
        user. Otherwise the request fails with `404 NOT_FOUND`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /projects/{projectId}:
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update a project
      description: |
        Omitted fields are unchanged. Send `tag_id: null` to detach the tag and
        `description: null` to clear the description. A non-null `tag_id` must
        reference a tag owned by the authenticated user, otherwise the request
        fails with `404 NOT_FOUND`.
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project
      description: |
        Deletes the project. Notes that referenced it remain and have
        `project_id` set to `null`.
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '204':
          description: Project deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /notes:
    get:
      tags: [Notes]
      operationId: listNotes
      summary: List notes
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: project_id
          in: query
          description: Only return notes attached to this project.
          schema:
            type: string
            format: uuid
        - name: tag_id
          in: query
          description: |
            Only return notes whose project is linked to this tag. Notes
            without a project are excluded.
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          description: Field to sort by.
          schema:
            type: string
            enum: [created_at, updated_at, title]
            default: created_at
        - name: order
          in: query
          description: Sort direction.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: A page of notes. Content is not included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    post:
      tags: [Notes]
      operationId: createNote
      summary: Create a note
      description: |
        Creates a note. `content` is optional and defaults to an empty
        rich-text document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '201':
          description: Note created, including its content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /notes/{noteId}:
    get:
      tags: [Notes]
      operationId: getNote
      summary: Get a note
      description: Returns the note with its rich-text content.
      parameters:
        - $ref: '#/components/parameters/NoteIdPath'
      responses:
        '200':
          description: The note and its content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Notes]
      operationId: updateNote
      summary: Update a note
      description: |
        Omitted fields are unchanged. Send `project_id: null` to detach the
        note from its project and `description: null` to clear the description.
        Sending `content` replaces the entire rich-text document.
      parameters:
        - $ref: '#/components/parameters/NoteIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteRequest'
      responses:
        '200':
          description: Updated note, including its content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags: [Notes]
      operationId: deleteNote
      summary: Delete a note
      description: Deletes the note.
      parameters:
        - $ref: '#/components/parameters/NoteIdPath'
      responses:
        '204':
          description: Note deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        JWT access token stored in the `access_token` `HttpOnly` cookie.
        Set by register, login, and refresh. Valid for 15 minutes.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        Opaque refresh token stored in the `refresh_token` `HttpOnly` cookie
        (`Path=/api/auth`). Set by register and login, rotated by refresh.
  parameters:
    Page:
      name: page
      in: query
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: perPage
      in: query
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      description: |
        Case-insensitive **substring** match (contains), not an exact match.
        Implemented as `ILIKE '%<value>%'`; partial words match. For tags it
        searches `name`; for projects it searches `title` and `description`;
        for notes it searches `title`, `description`, and the plain-text body
        (`content_text`). An empty value applies no filter.
      schema:
        type: string
        maxLength: 255
      example: note
    Order:
      name: order
      in: query
      description: Sort direction.
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    TagIdPath:
      name: tagId
      in: path
      required: true
      description: Tag id.
      schema:
        type: string
        format: uuid
    ProjectIdPath:
      name: projectId
      in: path
      required: true
      description: Project id.
      schema:
        type: string
        format: uuid
    NoteIdPath:
      name: noteId
      in: path
      required: true
      description: Note id.
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing, invalid, or expired credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required
    NotFound:
      description: Resource not found or not owned by the authenticated user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: Resource not found
    Conflict:
      description: Unique constraint violation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CONFLICT
              message: Username or email is already taken
              details:
                - field: email
                  message: Email is already registered
    UnprocessableEntity:
      description: The request body or query parameters failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid input
              details:
                - field: title
                  message: Title is required
    TooManyRequests:
      description: Too many authentication attempts.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              message: Too many attempts, try again later
  schemas:
    User:
      type: object
      required: [id, username, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    Tag:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 255
    Project:
      type: object
      required: [id, title, tag_id]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        tag_id:
          type: string
          format: uuid
          nullable: true
    Note:
      type: object
      required: [id, title, project_id, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    NoteDetail:
      allOf:
        - $ref: '#/components/schemas/Note'
        - type: object
          required: [content]
          properties:
            content:
              $ref: '#/components/schemas/NoteDocument'
    NoteDocument:
      type: object
      required: [type, content]
      additionalProperties: true
      description: |
        Rich-text document in TipTap/ProseMirror JSON format. The server
        derives the plain-text search projection (`content_text`) from the
        document; clients never send or receive `content_text` directly.
      properties:
        type:
          type: string
          enum: [doc]
        content:
          type: array
          items:
            $ref: '#/components/schemas/NoteNode'
      example:
        type: doc
        content:
          - type: paragraph
            content:
              - type: text
                text: "Hello "
              - type: text
                text: world
                marks:
                  - type: bold
                  - type: textStyle
                    attrs:
                      fontSize: 18px
    NoteNode:
      type: object
      required: [type]
      additionalProperties: true
      description: |
        A TipTap/ProseMirror node. `text` is required when `type` is `text`.
        Common block types include `paragraph`, `heading`, `bulletList`,
        `orderedList`, `listItem`, `blockquote`, and `codeBlock`.
      properties:
        type:
          type: string
        attrs:
          type: object
          additionalProperties: true
        content:
          type: array
          items:
            $ref: '#/components/schemas/NoteNode'
        marks:
          type: array
          items:
            $ref: '#/components/schemas/NoteMark'
        text:
          type: string
    NoteMark:
      type: object
      required: [type]
      additionalProperties: true
      description: |
        Inline formatting. Common types include `bold`, `italic`, `underline`,
        `strike`, `code`, `link`, and `textStyle`.
      properties:
        type:
          type: string
        attrs:
          type: object
          additionalProperties: true
          description: |
            Mark attributes. For example `textStyle` uses `{ "fontSize": "18px" }`
            and `link` uses `{ "href": "https://example.com" }`.
    PaginationMeta:
      type: object
      required: [page, perPage, total, totalPage]
      properties:
        page:
          type: integer
          minimum: 1
        perPage:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPage:
          type: integer
          minimum: 0
    TagList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ProjectList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    NoteList:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ErrorDetail:
      type: object
      required: [message]
      properties:
        field:
          type: string
          description: Field or parameter that caused the error.
